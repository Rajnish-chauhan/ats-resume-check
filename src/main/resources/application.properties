spring.application.name=ScoreMyCV
server.port=8080

# Upload constraints
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# MongoDB URI with Atlas and local fallbacks
spring.data.mongodb.uri=${MONGO_ATLAS_STRING:${MONGO_LOCAL_DB:mongodb://localhost:27017/resumedb}}

# OpenAI credentials
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2

# Allowed CORS origins
app.redirect.target-url=${FRONTEND_URL:https://ats.rajnishsystems.in,https://analyse.rajnishsystems.in,http://localhost:5173,http://localhost:3000}

# Admin Credentials (Injected from Environment, with robust default fallback)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}