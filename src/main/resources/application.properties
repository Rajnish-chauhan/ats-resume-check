spring.application.name=ResumeAnalyser
server.port=8080

# Upload payload limits
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB


# MongoDB connection string with production and local fallbacks
spring.data.mongodb.uri=${MONGO_ATLAS_STRING:${MONGO_LOCAL_DB:mongodb://localhost:27017/resumedb}}

# OpenAI credentials
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2

# Dynamic CORS origins supporting custom domains and local development
app.redirect.target-url=${FRONTEND_URL:https://analyse.rajnishsystems.rajnshsystems.in,https://analyse.rajnishsystems.in,http://localhost:5173,http://localhost:3000}