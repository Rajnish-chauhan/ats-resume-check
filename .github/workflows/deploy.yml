name: Deploy ScoreMyCV Backend to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/scoremycv-backend:latest

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Pulling latest Docker image from Docker Hub..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/scoremycv-backend:latest

            echo "Stopping existing ScoreMyCV container if running..."
            docker stop scoremycv-backend || true
            docker rm scoremycv-backend || true

            echo "Starting new ScoreMyCV container with secure GitHub Secrets on port 8082..."
            docker run -d --name scoremycv-backend --restart unless-stopped \
              -p 8082:8080 \
              -e MONGO_ATLAS_STRING="${{ secrets.MONGO_ATLAS_STRING }}" \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e FRONTEND_URL="https://ats.rajnishsystems.in,https://analyse.rajnishsystems.in" \
              -e ADMIN_USERNAME="${{ secrets.ADMIN_USERNAME }}" \
              -e ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
              ${{ secrets.DOCKERHUB_USERNAME }}/scoremycv-backend:latest

            echo "Deployment completed successfully. Pruning dangling images..."
            docker image prune -f